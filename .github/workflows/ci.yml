name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 312kg_tms
          POSTGRES_USER: 312kg
          POSTGRES_PASSWORD: 312kg_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 312kg -d 312kg_tms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://312kg:312kg_local_only@localhost:5432/312kg_tms?schema=public
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @312kg/api prisma generate

      - name: Apply database migrations
        run: pnpm --filter @312kg/api prisma migrate deploy

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
