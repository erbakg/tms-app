name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: 312kg_tms
          POSTGRES_USER: 312kg
          POSTGRES_PASSWORD: 312kg_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U 312kg -d 312kg_tms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://312kg:312kg_local_only@localhost:5432/312kg_tms?schema=public
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: 312kg-tms-test
      S3_ACCESS_KEY_ID: 312kg_local_only
      S3_SECRET_ACCESS_KEY: 312kg_local_only
      REDIS_URL: redis://localhost:6379
      AI_PROVIDER: mock
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @312kg/api exec prisma generate --schema prisma/schema.prisma

      - name: Apply database migrations
        run: pnpm --filter @312kg/api exec prisma migrate deploy --schema prisma/schema.prisma

      - name: Start MinIO
        run: |
          docker run --detach --name minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=312kg_local_only \
            --env MINIO_ROOT_PASSWORD=312kg_local_only \
            minio/minio:latest server /data
          for attempt in {1..12}; do
            curl --fail --silent http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          exit 1

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run end-to-end tests
        run: pnpm test:e2e

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
