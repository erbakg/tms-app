services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 312kg_tms
      POSTGRES_USER: 312kg
      POSTGRES_PASSWORD: 312kg_local_only
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U 312kg -d 312kg_tms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: adobe/s3mock:latest
    ports:
      - '9000:9090'
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: 312kg-tms-test
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /containers3root
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'true'
    volumes:
      - minio_data:/containers3root

volumes:
  postgres_data:
  minio_data:
