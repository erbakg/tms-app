services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 312kg_tms
      POSTGRES_USER: 312kg
      POSTGRES_PASSWORD: 312kg_local_only
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U 312kg -d 312kg_tms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
