services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: 312kg_tms
      POSTGRES_USER: 312kg
      POSTGRES_PASSWORD: 312kg_local_only
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U 312kg -d 312kg_tms']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: 312kg_local_only
      MINIO_ROOT_PASSWORD: 312kg_local_only
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
